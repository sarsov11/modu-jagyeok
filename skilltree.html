<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스킬트리 — 모두의 자격</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.skin=localStorage.getItem("mj.skin")||"white"}catch(e){document.documentElement.dataset.skin="white"}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  .wrapx{max-width:1360px;margin:0 auto;padding:0 var(--s3) var(--s6)}
  h1,h2,.pk-title{font-family:var(--title);font-weight:var(--tw);letter-spacing:var(--tls)}
  .phead h1{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .crumb{display:inline-flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .crumb .up{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;
    color:var(--ink-3);padding:0;font-family:var(--title);font-weight:var(--tw);
    letter-spacing:var(--tls);text-decoration:underline;
    text-decoration-color:var(--line-3);text-underline-offset:5px;transition:color .18s}
  .crumb .up:hover{color:var(--ink);text-decoration-color:var(--red)}
  .crumb .sep{color:var(--line-3);font-size:.6em;transform:translateY(-.12em)}
  .swapin{animation:swapin .5s cubic-bezier(.32,.72,0,1) both}
  @keyframes swapin{from{opacity:0;transform:translateY(.28em) scale(.94)}to{opacity:1;transform:none}}
  .phead .sub{max-width:70ch;font-size:15px;font-weight:600;color:var(--ink-2);
    letter-spacing:-.02em;line-height:1.6}

  .segbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .seg{appearance:none;border:1px solid var(--line);background:var(--surface);cursor:pointer;
    font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink-3);
    padding:10px 16px;border-radius:var(--r1);transition:.18s;display:flex;align-items:center;gap:9px}
  .seg:hover{color:var(--ink);border-color:var(--line-3)}
  .seg .dot{width:9px;height:9px;border-radius:50%;transition:transform .2s}
  .seg[aria-selected="true"]{color:#06110F;font-weight:700}
  .seg[aria-selected="true"] .dot{transform:scale(0)}
  .seg.back{font-weight:700;color:var(--ink-2);border-color:var(--line-2);background:var(--surface-2)}
  .seg.back:hover{transform:translateX(-2px)}
  .seg.back[hidden]{display:none}

  .board{position:relative;border-radius:var(--r3);overflow:hidden;border:1px solid var(--line);
    background:var(--stage);margin-top:var(--s3);box-shadow:var(--shadow)}
  .board .plate{display:flex;align-items:baseline;justify-content:space-between;gap:18px;
    flex-wrap:wrap;padding:22px 28px 10px}
  .board .plate h2{font-size:27px;color:var(--stage-ink)}
  .board .plate .sub{font-size:14.5px;color:var(--stage-ink-2);font-family:var(--kr);
    font-weight:600;letter-spacing:-.02em}
  .board .stage{position:relative;min-height:420px;background:
    radial-gradient(ellipse 80% 60% at 50% 46%,var(--neb-1),transparent 66%),
    radial-gradient(ellipse 50% 40% at 18% 88%,var(--neb-2),transparent 70%),var(--stage)}
  :root[data-skin="note"] .board .stage{background-image:
      repeating-linear-gradient(0deg,transparent 0 21px,rgba(120,110,85,.11) 21px 22px),
      repeating-linear-gradient(90deg,transparent 0 21px,rgba(120,110,85,.08) 21px 22px),
      radial-gradient(ellipse 80% 60% at 50% 46%,var(--neb-1),transparent 66%);
    background-color:var(--stage)}
  /* 궤도는 원 배치라 알맹이가 정사각에 가깝다 — 폭에 맞추면 화면보다 길어진다.
     높이를 화면에 맞춰 자르고 preserveAspectRatio 로 가운데 정렬한다. */
  /* 높이를 못 박고, viewBox 를 그 비율에 맞춰 넓혀서 letterbox 를 없앤다.
     height:auto 로 두면 정원 궤도가 판보다 길어지거나 좌우가 텅 빈다(2026-08-31 실측). */
  .board svg{display:block;width:100%;height:clamp(430px,50vw,690px)}
  @media(max-width:760px){.board svg{height:clamp(460px,120vw,760px)}}
  .node{cursor:pointer}
  .node:focus-visible{outline:none}
  .nb{transform-box:fill-box;transform-origin:center;
    transition:transform .26s cubic-bezier(.2,1.25,.35,1)}
  .node.hot .nb{transform:scale(1.16)}
  .lbl{transition:opacity .2s,transform .26s cubic-bezier(.2,1.25,.35,1)}
  .lbl.hot{transform-box:fill-box;transform-origin:center;transform:scale(1.06)}
  svg.dim .node:not(.hot){opacity:.3;transition:opacity .2s}
  svg.dim .lbl:not(.hot){opacity:.28}

  /* 미리보기 카드 */
  .peek{position:fixed;z-index:70;width:356px;pointer-events:none;border-radius:var(--r2);
    padding:17px 19px 15px;background:var(--stage-2);border:1px solid var(--stage-line);
    box-shadow:0 24px 60px -22px rgba(0,0,0,.55);opacity:0;
    transform:translateY(6px) scale(.98);transition:opacity .16s ease,transform .16s}
  .peek.on{opacity:1;transform:none}
  .peek[hidden]{display:none}
  .pk-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pk-eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--stage-ink-2)}
  .pk-tier{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--stage);
    padding:3px 10px;border-radius:6px;letter-spacing:.06em}
  .pk-title{font-size:20px;color:var(--stage-ink);margin:9px 0 0;line-height:1.3}
  .pk-q{font-size:13.5px;line-height:1.6;color:var(--stage-ink-2);margin-top:9px;
    padding-left:11px;border-left:2px solid var(--stage-line)}
  .pk-sep{height:1px;background:var(--stage-line);margin:13px 0 11px}
  .pk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pk-stats b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;
    color:var(--stage-ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pk-stats span{font-size:11.5px;color:var(--stage-ink-2)}
  .pk-keys{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .pk-key{font-size:12.5px;padding:4px 10px;border-radius:7px;background:var(--surface-2);
    color:var(--ink-2);border:1px solid var(--line-2)}
  .pk-foot{margin-top:11px;font-size:11.5px;color:var(--stage-ink-2);font-family:var(--mono)}

  /* 노드 시트 */
  .sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:center;
    justify-content:center;padding:24px}
  .sheet[hidden]{display:none}
  .sheetbg{position:absolute;inset:0;background:rgba(4,6,10,.62);backdrop-filter:blur(6px);
    opacity:0;transition:opacity .34s}
  .sheet.on .sheetbg{opacity:1}
  .sheetcard{position:relative;width:min(820px,100%);max-height:86vh;overflow:auto;
    background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r3);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.8);opacity:0;
    transform:scale(.9) translateY(14px);
    transition:opacity .3s ease,transform .44s cubic-bezier(.32,.72,0,1)}
  .sheet.on .sheetcard{opacity:1;transform:none}
  .sh-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:22px 26px 16px;
    border-bottom:1px solid var(--line)}
  .sh-eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--ink-4)}
  .sh-top h3{font-size:25px;margin:8px 0 0;letter-spacing:-.04em;
    font-family:var(--title);font-weight:var(--tw)}
  .sh-x{position:absolute;right:18px;top:18px;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-3);
    cursor:pointer;font-size:15px;line-height:1;transition:.16s}
  .sh-x:hover{color:var(--ink);border-color:var(--line-3)}
  .sh-facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
  .fact{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);
    background:var(--surface-2);padding:5px 10px;border-radius:7px}
  .fact b{color:var(--ink);font-weight:600}
  .sh-body{padding:18px 26px 26px}
  .sh-note{font-size:12.5px;color:var(--ink-4);line-height:1.72;margin-bottom:16px;
    border-left:2px solid var(--line-2);padding-left:12px}
  .sh-note b{color:var(--ink-3)}
  .keylist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .keylist span{font-size:13px;padding:5px 11px;border-radius:8px;background:var(--surface-2);
    border:1px solid var(--line);color:var(--ink-2)}
  .qprev{border:1px solid var(--line);border-radius:var(--r1);background:var(--surface-2);
    padding:13px 15px;margin-bottom:8px;font-size:14px;line-height:1.65;color:var(--ink-2)}
  .qprev .m{font-family:var(--mono);font-size:11.5px;color:var(--ink-4);display:flex;gap:9px;
    flex-wrap:wrap;margin-top:7px}
  .qprev .m .ox{font-weight:700}
  .qprev .m .ox.o{color:var(--mint)} .qprev .m .ox.x{color:var(--red-2)}
  .goact{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;
    color:var(--ink-4);margin-top:16px;font-family:var(--mono)}
  .legend .k{display:flex;align-items:center;gap:7px}
  .legend .dot{width:13px;height:13px;border-radius:50%;display:inline-block}
  .legend .sz{display:flex;align-items:center;gap:6px;padding-left:16px;border-left:1px solid var(--line-2)}
  .legend .sz i{display:inline-block;border-radius:50%;background:var(--ink-4);opacity:.55}
  .note{font-size:13px;color:var(--ink-4);border-left:2px solid var(--line-2);padding-left:14px;
    margin-top:14px;line-height:1.75;max-width:96ch}
  .note b{color:var(--ink-3)}

  .treelist{display:none}
  .grp{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:12px;
    background:var(--surface)}
  .grp .gh{display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid var(--line);background:var(--surface-2)}
  .grp .gh .cd{font-family:var(--mono);font-size:13px;font-weight:700}
  .grp .gh h3{font-size:16px;flex:1;min-width:0}
  .grp .gh .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-4)}
  .mrow{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;
    border-bottom:1px solid var(--line);background:var(--surface)}
  .mrow:last-child{border-bottom:0}
  .mrow .bul{width:13px;height:13px;border-radius:50%;flex:0 0 13px}
  .mrow .nm{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .pc{font-family:var(--mono);font-size:12px;color:var(--ink-4);flex:0 0 auto}
  @media(max-width:760px){
    .treelist{display:block;margin-top:var(--s3)}
    .board .plate{padding:16px 18px 8px}
    .board .plate h2{font-size:21px}
    .sheet{padding:0;align-items:flex-end}
    .sheetcard{width:100%;max-height:90vh;border-radius:var(--r3) var(--r3) 0 0;transform:translateY(40px)}
  }
</style>
</head>
<body>
<div class="wrapx">
  <div class="phead">
    <div>
      <span class="kicker"><i></i>스킬트리</span>
      <h1><span class="crumb" id="crumb"></span></h1>
      <p class="sub" id="lede"></p>
    </div>
    <div class="pheadact">
      <div class="segbar"><button class="seg back" id="backbtn" hidden>← 전체</button>
        <span id="segs" style="display:contents"></span></div>
    </div>
  </div>

  <section class="board">
    <div class="plate"><h2 id="plateTitle"></h2><p class="sub" id="plateSub"></p></div>
    <div class="stage"><svg id="orbit" viewBox="0 0 1280 880" preserveAspectRatio="xMidYMid meet" role="img" aria-label="스킬트리"></svg></div>
  </section>

  <div class="treelist" id="treelist"></div>
  <div class="legend" id="legend"></div>
  <p class="note" id="note"></p>
</div>

<div class="peek" id="peek" hidden aria-hidden="true">
  <div class="pk-top"><span class="pk-eyebrow" id="pkEyebrow"></span>
    <span class="pk-tier" id="pkTier"></span></div>
  <h4 class="pk-title" id="pkTitle"></h4>
  <p class="pk-q" id="pkQ"></p>
  <div class="pk-sep"></div>
  <div id="pkBody"></div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheetbg" id="sheetbg"></div>
  <div class="sheetcard">
    <div class="sh-top">
      <button class="sh-x" id="shx" aria-label="닫기">✕</button>
      <span class="sh-eyebrow" id="shEyebrow"></span>
      <h3 id="shTitle"></h3>
      <div class="sh-facts" id="shFacts"></div>
    </div>
    <div class="sh-body">
      <div class="keylist" id="shKeys"></div>
      <p class="sh-note" id="shNote"></p>
      <div id="shList"></div>
      <div class="goact" id="shGo"></div>
    </div>
  </div>
</div>

<script src="js/catalog.js"></script>
<script src="data/ready.js"></script>
<script src="js/boot.js"></script>
<script src="js/store.js"></script>
<script>
(function(){
  var T=GB.T, esc=GB.esc;
  GB.mountNav("skilltree.html");

  function cv(k){ return getComputedStyle(document.documentElement).getPropertyValue(k).trim(); }
  function hsl(hex){
    var m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||"");
    if(!m) return [200,60,55];
    var r=parseInt(m[1],16)/255,g=parseInt(m[2],16)/255,b=parseInt(m[3],16)/255;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0,l=(mx+mn)/2;
    var sa=d===0?0:d/(1-Math.abs(2*l-1));
    if(d){ h = mx===r?60*(((g-b)/d)%6) : mx===g?60*((b-r)/d+2) : 60*((r-g)/d+4); }
    if(h<0) h+=360;
    return [Math.round(h),Math.round(sa*100),Math.round(l*100)];
  }
  var PARTS=T.parts.map(function(p){ return p.no; });
  var PC={};
  var GOLD,STAR,SLINE,SINK,SINK2,SBG,SBG2,CORE;
  function paint(){
    T.parts.forEach(function(p){
      var hex=cv(p.color)||"#4FC3E8", c=hsl(hex);
      PC[p.no]={hex:hex,h:c[0],s:c[1]};
    });
    GOLD=cv("--fam-soc")||"#FFD86B"; STAR=cv("--star")||"#CFE0FF";
    CORE=cv("--core-glow")||"#4E7BD6"; SLINE=cv("--stage-line")||"#2B3D5C";
    SINK=cv("--stage-ink")||"#DEE8F8"; SINK2=cv("--stage-ink-2")||"#A9BEDF";
    SBG=cv("--stage")||"#070B14"; SBG2=cv("--stage-2")||"#0C1424";
  }
  function paper(){ var k=document.documentElement.dataset.skin;
    return k==="jelly"||k==="note"||k==="white"; }
  function glowK(){ var k=document.documentElement.dataset.skin;
    return k==="white"?.35 : k==="note"?.5 : k==="jelly"?.8 : 1; }

  var TIER={
    S:{n:"S",l:80,pl:38,m:1,pm:1,   label:"성취도 80 이상"},
    A:{n:"A",l:65,pl:52,m:1,pm:.98, label:"60 이상"},
    B:{n:"B",l:52,pl:66,m:.94,pm:.86,label:"30 이상"},
    C:{n:"C",l:40,pl:78,m:.86,pm:.70,label:"30 미만"},
    L:{n:"–",l:36,pl:87,m:.44,pm:.30,label:"아직 안 풂"}
  };
  function tone(part,t,dl){
    var F=PC[part]||{h:200,s:60}, k=TIER[t], pp=paper(), d=(dl||0);
    return "hsl("+F.h+" "+Math.round(F.s*(pp?k.pm:k.m))+"% "+(pp?k.pl-d:k.l+d)+"%)";
  }
  function tierOf(a,played){ return !played?"L":a>=80?"S":a>=60?"A":a>=30?"B":"C"; }
  function howFar(st){
    if(!st.n) return "붙은 기출 선지가 없어요";
    if(!st.solved) return "아직 시작 전이에요";
    if(st.achieve<30) return "이제 막 시작했어요";
    if(st.achieve<60) return "절반쯤 왔어요";
    if(st.achieve<80) return "감이 잡히고 있어요";
    return "여기는 든든해요";
  }

  /* ══ SVG ══ */
  var NS="http://www.w3.org/2000/svg";
  function el(tag,attrs,parent){
    var e=document.createElementNS(NS,tag);
    for(var k in attrs) if(attrs[k]!=null) e.setAttribute(k,attrs[k]);
    if(parent) parent.appendChild(e);
    return e;
  }
  function txt(p,s,a){ var t=el("text",a,p); t.textContent=s; return t; }
  function seed(s){ var h=2166136261;
    for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
    return ((h>>>0)%10000)/10000; }
  var rad=function(a){ return a*Math.PI/180; };

  var LAY={};
  function layout(){
    var st=document.querySelector(".board .stage");
    var W=Math.max(340,Math.round(st?st.clientWidth:1180));
    var k=Math.max(.52,Math.min(1,W/1180));
    var H=Math.round(W<640?W*1.30 : W<900?W*.88 : W*.58);
    LAY={W:W,H:H,CX:W/2,CY:H/2,k:k,
         rCore:Math.round(74*k+12),
         fCore:Math.round(28*k+8),
         fName:Math.round(11*k+4),
         fSub:Math.round(9*k+3)};
    return LAY;
  }
  var uid=0;
  function svgEl(){ return document.getElementById("orbit"); }
  function fitView(layer){
    var svg=svgEl();
    var ink=layer? layer.querySelector(".ink") : svg.querySelector(".layer .ink");
    if(!ink) return;
    var bb; try{ bb=ink.getBBox(); }catch(e){ return; }
    if(!bb||!bb.width) return;
    var pad=Math.round(16*LAY.k)+8;
    var x=bb.x-pad, y=bb.y-pad, w=bb.width+pad*2, h=bb.height+pad*2;
    /* 그려 놓은 판의 비율에 맞춰 모자란 쪽을 늘린다 — 안 그러면 남는 쪽이 빈 띠로 남는다 */
    var box=svg.getBoundingClientRect();
    var want=(box.width&&box.height)?(box.width/box.height):(w/h);
    if(w/h < want){ var nw=h*want; x-=(nw-w)/2; w=nw; }
    else{ var nh=w/want; y-=(nh-h)/2; h=nh; }
    svg.setAttribute("viewBox",[x.toFixed(0),y.toFixed(0),w.toFixed(0),h.toFixed(0)].join(" "));
  }
  /* 검은 원 + 테두리 + 아래에서 차오르는 채움 */
  function orb(parent,x,y,r,col,pct,opt){
    opt=opt||{};
    var g=el("g",{},parent), p=Math.max(0,Math.min(100,pct||0))/100;
    if(!opt.flat)
      el("circle",{class:"nb",cx:x,cy:y,r:r+11,fill:col,
        opacity:((paper()?(p?.2:.1):(p?.28:.14))*glowK()).toFixed(3),
        filter:"url(#soft)","pointer-events":"none"},g);
    el("circle",{class:"nb",cx:x,cy:y,r:r,fill:SBG2,"fill-opacity":1},g);
    if(p>0){
      var id="fill"+(++uid);
      var cp=el("clipPath",{id:id},g);
      el("rect",{x:x-r,y:y+r-2*r*p,width:2*r,height:2*r*p},cp);
      el("circle",{class:"nb",cx:x,cy:y,r:r,fill:col,"fill-opacity":paper()?.5:.42,
        "clip-path":"url(#"+id+")"},g);
      var yy=y+r-2*r*p, half=Math.sqrt(Math.max(0,r*r-(yy-y)*(yy-y)));
      el("line",{x1:x-half,y1:yy,x2:x+half,y2:yy,stroke:col,"stroke-width":1.8,opacity:".9"},g);
    }
    el("circle",{class:"nb",cx:x,cy:y,r:r,fill:"none",stroke:col,
      "stroke-width":opt.bold?2.6:2.1,opacity:p?1:(paper()?.8:.6)},g);
    return g;
  }
  function coreOrb(g,hue,title,sub,onClick){
    var L=LAY, gid="cg"+(++uid);
    var d=el("defs",{},g), rg=el("radialGradient",{id:gid},d);
    el("stop",{offset:"0%","stop-color":hue,"stop-opacity":paper()?".55":".8"},rg);
    el("stop",{offset:"64%","stop-color":hue,"stop-opacity":".12"},rg);
    el("stop",{offset:"100%","stop-color":hue,"stop-opacity":"0"},rg);
    el("circle",{cx:L.CX,cy:L.CY,r:L.rCore*2.1,fill:"url(#"+gid+")","pointer-events":"none"},g);

  function liven(gp,labels,onEnter,onLeave){
    gp.classList.add("node"); gp.setAttribute("tabindex","0"); gp.setAttribute("role","button");
    function on(){ gp.classList.add("hot");
      (labels||[]).forEach(function(l){ l.classList.add("hot"); }); if(onEnter) onEnter(); }

  function defsOf(svg){
    var d=el("defs",{},svg);

  /* 라벨이 겹치면 실제 상자를 재서 바깥으로 밀어낸다 */
  function unstack(g,cx,cy){
    var gs=[].slice.call(g.querySelectorAll(".lblg"));
    if(gs.length<2) return;
    var circles=gs.map(function(x){ return {x:+x.dataset.cx,y:+x.dataset.cy,r:+x.dataset.r}; });
    function boxCircle(b,c){
      var nx=Math.max(b.x,Math.min(c.x,b.x+b.width));
      var ny=Math.max(b.y,Math.min(c.y,b.y+b.height));
      return Math.hypot(c.x-nx,c.y-ny) < c.r+2;
    }
    function box(x){ try{ return x.getBBox(); }catch(e){ return null; } }
    function hit(a,b,pad){ pad=pad||0;
      return a.x<b.x+b.width+pad && a.x+a.width+pad>b.x &&
             a.y<b.y+b.height+pad && a.y+a.height+pad>b.y; }
    var st=gs.map(function(x,i){
      var b=box(x), ux=(+x.dataset.cx)-cx, uy=(+x.dataset.cy)-cy, m=Math.hypot(ux,uy)||1;
      return {g:x,b:b,ux:ux/m,uy:uy/m,dx:0,dy:0,own:i};
    }).filter(function(x){ return x.b; });
    for(var pass=0;pass<5;pass++){
      var moved=false;
      for(var i=0;i<st.length;i++){
        var A=st[i], push=false;
        for(var j=0;j<st.length;j++){ if(i!==j&&hit(A.b,st[j].b,2)){ push=true; break; } }
        if(!push) for(var c=0;c<circles.length;c++){
          if(c===A.own) continue;
          if(boxCircle(A.b,circles[c])){ push=true; break; }
        }
        if(push){
          A.dx+=A.ux*9; A.dy+=A.uy*9;
          A.g.setAttribute("transform","translate("+A.dx.toFixed(1)+","+A.dy.toFixed(1)+")");
          A.b=box(A.g); moved=true;
        }
      }
      if(!moved) break;
    }
  }

  /* ══ 층 이동 ══ */
  var EASE="cubic-bezier(.32,.72,0,1)";
  function swap(drawNext,ox,oy,dir){
    if(busy) return;
    busy=true; hidePeek();
    var svg=svgEl(), out=svg.querySelector(".layer");
    var g=el("g",{class:"layer"},svg);
    drawNext(g);
    var o=ox+"px "+oy+"px";
    var big=dir>0?2.35:.46, small=dir>0?.46:2.35;
    if(out){
      out.style.transformOrigin=o;
      out.style.transition="transform .58s "+EASE+",opacity .34s ease";
      requestAnimationFrame(function(){ out.style.transform="scale("+big+")"; out.style.opacity="0"; });
    }
    fitView(g);
    g.style.transformOrigin=o; g.style.transform="scale("+small+")"; g.style.opacity="0";
    requestAnimationFrame(function(){
      g.style.transition="transform .58s "+EASE+",opacity .4s ease";
      g.style.transform="none"; g.style.opacity="1";
    });
    setTimeout(function(){
      if(out&&out.parentNode) out.parentNode.removeChild(out);
      g.style.transition=""; busy=false;
    },620);
  }
  function goPart(p,ox,oy){

  function goCh(k,ox,oy){

  }

      var b=document.createElement("button");
      b.className="seg"; b.dataset.part=p.no;
      b.innerHTML='<span class="dot" style="background:'+(PC[p.no]?PC[p.no].hex:"#888")+'"></span>'+esc(p.name);
      b.onclick=function(){
        if(busy||part===p.no) return;
        if(level===0) goPart(p.no,LAY.CX,LAY.CY-100);
        else{ part=p.no; chk=null; level=1;
              swap(function(g){ drawPart(g,p.no); },LAY.CX,LAY.CY,1);
              head(); drawList(); legend(); }
      };
      host.appendChild(b);
    });
  }

  /* ══ 미리보기 ══ */
  var peek=document.getElementById("peek"), peekTimer=null;
  function place(g){
    peek.hidden=false; peek.setAttribute("aria-hidden","false");
    var r=g.getBoundingClientRect(), pw=356, ph=peek.offsetHeight||320;
    var x=r.right+18, y=r.top+r.height/2-ph/2;
    if(x+pw>window.innerWidth-14) x=r.left-pw-18;
    if(x<14) x=Math.min(Math.max(14,r.left+r.width/2-pw/2),window.innerWidth-pw-14);
    y=Math.min(Math.max(14,y),window.innerHeight-ph-14);
    peek.style.left=x+"px"; peek.style.top=y+"px";
    requestAnimationFrame(function(){ peek.classList.add("on"); });
  }
  function dim(g){ var s=g.ownerSVGElement; if(s) s.classList.add("dim"); }
  function partPeek(p,g){
    clearTimeout(peekTimer); dim(g);
    var st=GB.partStat(p.no), chs=GB.chsOf(p.no);
    document.getElementById("pkEyebrow").textContent="편";
    var tc=document.getElementById("pkTier");
    tc.textContent="들어가기"; tc.style.background=PC[p.no].hex; tc.style.color=SBG;
    document.getElementById("pkTitle").textContent=p.name;
    document.getElementById("pkQ").textContent=
      "장 "+chs.length+" · 쟁점 "+st.nodes+"개";
    document.getElementById("pkBody").innerHTML=
      '<div class="pk-stats"><div><b>'+st.vol+'</b><span>학습 분량</span></div>'+
      '<div><b>'+st.n+'</b><span>기출 선지</span></div>'+
      '<div><b>'+st.achieve+'%</b><span>성취도</span></div></div>'+
      '<div class="pk-keys">'+chs.slice(0,8).map(function(c){
        return '<span class="pk-key">'+esc(c.name)+'</span>'; }).join("")+'</div>'+
      '<div class="pk-foot">눌러서 들어가기</div>';
    place(g);
  }
  function chPeek(c,g){
    clearTimeout(peekTimer); dim(g);
    var st=GB.chStat(c.key), list=chNodes(c.key);
    document.getElementById("pkEyebrow").textContent=GB.part(c.part).name;
    var tc=document.getElementById("pkTier");
    tc.textContent="들어가기"; tc.style.background=PC[c.part].hex; tc.style.color=SBG;
    document.getElementById("pkTitle").textContent=c.name;
    document.getElementById("pkQ").textContent="쟁점 "+list.length+"개";
    document.getElementById("pkBody").innerHTML=
      '<div class="pk-stats"><div><b>'+st.vol+'</b><span>학습 분량</span></div>'+
      '<div><b>'+st.n+'</b><span>기출 선지</span></div>'+
      '<div><b>'+st.achieve+'%</b><span>성취도</span></div></div>'+
      '<div class="pk-keys">'+list.slice(0,7).map(function(n){
        return '<span class="pk-key">'+esc(n.title.slice(0,18))+'</span>'; }).join("")+'</div>'+
      '<div class="pk-foot">눌러서 들어가기</div>';
    place(g);
  }
  function nodePeek(n,g){
    clearTimeout(peekTimer); dim(g);
    var st=GB.nodeStat(n.no), tier=tierOf(st.achieve,st.solved>0);
    document.getElementById("pkEyebrow").textContent=GB.ch(n.chkey).name;
    var tc=document.getElementById("pkTier");
    tc.textContent=tier==="L"?"미착수":TIER[tier].n;
    tc.style.background=tier==="S"?GOLD:tone(n.part,tier);
    tc.style.color=(tier==="C"||tier==="L")?SBG2:SBG;
    document.getElementById("pkTitle").textContent=n.title;
    document.getElementById("pkQ").textContent=
      "학습 분량 "+n.vol+"쪽 · 기출 선지 "+n.q+"개 · "+howFar(st);
    document.getElementById("pkBody").innerHTML=
      '<div class="pk-stats"><div><b>'+n.vol+'</b><span>학습 분량</span></div>'+
      '<div><b>'+n.q+'</b><span>기출 선지</span></div>'+
      '<div><b>'+st.achieve+'%</b><span>성취도</span></div></div>'+
      '<div class="pk-keys">'+GB.qs(n.no).slice(0,3).map(function(q){
        return '<span class="pk-key">'+esc(q.t.slice(0,26))+'…</span>'; }).join("")+'</div>'+
      '<div class="pk-foot">눌러서 열기 · 판례 '+n.cs+' · 조문 '+n.law+'</div>';
    place(g);
  }
  function hidePeek(){
    peek.classList.remove("on");
    document.querySelectorAll("svg.dim").forEach(function(s){ s.classList.remove("dim"); });
    peekTimer=setTimeout(function(){ peek.hidden=true;
      peek.setAttribute("aria-hidden","true"); },180);
  }

  /* ══ 노드 시트 ══ */
  var sheet=document.getElementById("sheet");
  function openSheet(n){
    var st=GB.nodeStat(n.no), qs=GB.qs(n.no);
    document.getElementById("shEyebrow").textContent=
      GB.part(n.part).name+" · "+GB.ch(n.chkey).name;
    document.getElementById("shTitle").textContent=n.title;
    document.getElementById("shFacts").innerHTML=
      '<span class="fact">학습 분량 <b>'+n.vol+'</b>쪽</span>'+
      '<span class="fact">기출 선지 <b>'+n.q+'</b></span>'+
      '<span class="fact">판례 <b>'+n.cs+'</b></span>'+
      '<span class="fact">조문 <b>'+n.law+'</b></span>'+
      '<span class="fact">'+howFar(st)+(st.solved?" · <b>"+st.achieve+"</b>%":"")+'</span>';
    document.getElementById("shKeys").innerHTML="";
    document.getElementById("shNote").innerHTML=
      '<b>원 크기</b>는 기출 수가 아니라 <b>학습 분량</b>입니다 — '+
      '기출 수로 재면 최근 몇 해에 몰린 쟁점이 실제보다 커집니다. '+
      '기출 선지 수는 따로 셌습니다. 문장은 모두 <b>기출 원본</b>이고 O·X 는 그 시험의 정답표를 따릅니다.';
    /* ★ 풀기 전에는 답을 보여 주지 않는다 — 옛 판은 선지 다섯 개를 O·X 와 함께 미리 보여 줘서
       바로 아래 「O·X 풀기」의 첫 문장들 답이 새었다(2026-09-23). 개수만 말한다. */
    document.getElementById("shList").innerHTML= qs.length
      ? '<p style="font-size:14px;color:var(--ink-3)">이 쟁점의 기출 문장 '+qs.length+'개 — 답은 풀고 나서 보여 줘요.</p>'
      : '<p style="font-size:14px;color:var(--ink-3)">이 쟁점에 붙은 기출 문장이 아직 없어요.</p>';
    document.getElementById("shGo").innerHTML= qs.length
      ? '<a class="btn" href="ox.html?node='+n.no+'">이 쟁점 O·X 풀기</a>'+
        '<a class="btn ghost" href="ox.html?read='+n.no+'">맞는 문장 읽기</a>'
      : '<span class="muted">이 쟁점은 아직 기출 문장이 없어요.</span>';
    sheet.hidden=false;
    requestAnimationFrame(function(){ sheet.classList.add("on"); });
    document.body.style.overflow="hidden";
  }
  function closeSheet(){
    sheet.classList.remove("on"); document.body.style.overflow="";
    setTimeout(function(){ sheet.hidden=true; },340);
  }
  document.getElementById("shx").onclick=closeSheet;
  document.getElementById("sheetbg").onclick=closeSheet;
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&!sheet.hidden) closeSheet(); });

  /* ══ 폰용 목록 ══ */
  function drawList(){
    var host=document.getElementById("treelist");
    if(level===0){
      host.innerHTML=T.parts.map(function(p){
        var st=GB.partStat(p.no);
        return '<div class="grp"><div class="gh">'+
          '<span class="cd" style="color:'+PC[p.no].hex+'">'+p.no+'</span>'+
          '<h3>'+esc(p.name)+'</h3><span class="n">'+st.vol+'쪽 · 기출 '+st.n+'</span></div>'+
          GB.chsOf(p.no).map(function(c){
            return '<div class="mrow" data-goch="'+c.key+'">'+
              '<span class="bul" style="background:'+PC[p.no].hex+';opacity:.7"></span>'+
              '<span class="nm">'+esc(c.name)+'</span>'+
              '<span class="pc">쟁점 '+c.nodes.length+'</span></div>';
          }).join("")+'</div>';
      }).join("");
    }else{
      var chs=(level===2&&chk)?[GB.ch(chk)]:GB.chsOf(part);
      host.innerHTML=chs.map(function(c){
        return '<div class="grp"><div class="gh">'+
          '<span class="cd" style="color:'+PC[c.part].hex+'">'+c.no+'</span>'+
          '<h3>'+esc(c.name)+'</h3><span class="n">쟁점 '+c.nodes.length+'</span></div>'+
          chNodes(c.key).map(function(n){
            var st=GB.nodeStat(n.no), tier=tierOf(st.achieve,st.solved>0);
            return '<div class="mrow" data-node="'+n.no+'">'+
              '<span class="bul" style="background:'+(tier==="S"?GOLD:tone(c.part,tier,paper()?14:0))+
              ';opacity:'+(tier==="L"?.55:1)+'"></span>'+
              '<span class="nm">'+esc(n.title)+'</span>'+
              '<span class="pc">'+n.vol+'쪽 · 기출 '+n.q+'</span></div>';
          }).join("")+'</div>';
      }).join("");
    }
    host.querySelectorAll("[data-goch]").forEach(function(b){
      b.onclick=function(){ goCh(b.dataset.goch,LAY.CX,LAY.CY); };
    });
    host.querySelectorAll("[data-node]").forEach(function(b){
      b.onclick=function(){ openSheet(GB.node(+b.dataset.node)); };
    });
  }

  /* ══ 범례·주석 ══ */
  function legend(){
    var p=part||T.parts[0].no;
    var size='<span class="sz">원 크기<i style="width:9px;height:9px"></i>'+
             '<i style="width:16px;height:16px"></i>학습 분량</span>';
    document.getElementById("legend").innerHTML=(level>0
      ? ["S","A","B","C","L"].map(function(k){
          return '<span class="k"><i class="dot" style="background:'+
            (k==="S"?GOLD:tone(p,k))+'"></i>'+TIER[k].n+' — '+TIER[k].label+'</span>'; }).join("")
      : T.parts.map(function(x){
          return '<span class="k"><i class="dot" style="background:'+PC[x.no].hex+'"></i>'+
            esc(x.name)+'</span>'; }).join(""))+size;
  }
  function note(){
    var s=T.stat;
    document.getElementById("note").innerHTML=
      '<b>이 트리는 '+esc(T.subject)+' 시험 범위를 편 '+s.parts+' · 장 '+s.chs+' · 쟁점 '+s.nodes+
      '개로 갈라 놓은 것</b>입니다. 장(중영역)은 편 안에서 쟁점을 묶기 위해 부여한 층입니다.<br>'+
      '<b>원 크기는 기출 수가 아니라 학습 분량</b>입니다. 기출 수로 재면 최근 몇 해에 몰린 쟁점이 '+
      '실제보다 커지고, 아직 선지가 안 붙은 쟁점은 점으로 사라집니다.<br>'+
      '<b>기출 선지 '+GB.num(s.q)+'개</b>는 공개된 기출에서 뽑아 쟁점에 붙였습니다. O·X 판정은 '+
      '그 시험의 정답표 그대로입니다.<br>'+
      '성취도는 이 브라우저에 쌓인 학습 기록입니다 — 얼마나 풀었나 55, 얼마나 맞았나 45로 세고, 맞힌 비율은 열 문장을 풀 때까지 덜 셉니다.';
  }

  /* ══ 시작 ══ */
  function boot(){
    paint();
    var svg=svgEl();
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    defsOf(svg);
    var g=el("g",{class:"layer"},svg);
    if(level===0) drawAll(g);
    else if(level===2&&chk) drawCh(g,chk);
    else drawPart(g,part);
    fitView(g);
    head(); drawList(); legend(); note();
  }
  var reT=null;
  window.addEventListener("resize",function(){
    clearTimeout(reT);
    reT=setTimeout(function(){
      var st=document.querySelector(".board .stage");
      if(!st||!st.clientWidth||busy) return;
      if(Math.abs(st.clientWidth-(LAY.W||0))<8) return;
      boot(); head();
    },160);
  });
  segs();
  var QS=new URLSearchParams(location.search);
  if(QS.get("ch")&&GB.ch(QS.get("ch"))){ chk=QS.get("ch"); part=GB.ch(chk).part; level=2; }
  else if(QS.get("part")&&GB.part(+QS.get("part"))){ part=+QS.get("part"); level=1; }
  boot();
  var wantNode=QS.get("node");
  if(wantNode&&GB.node(+wantNode)) setTimeout(function(){ openSheet(GB.node(+wantNode)); },300);
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape"||busy||!sheet.hidden) return;
    if(level===2&&part) goPart(part,LAY.CX,LAY.CY);
    else if(level===1) goAll();
  });
  window.addEventListener("terra:skin",function(){ boot(); });
  GB.mountNext();
})();
</script>
</body>
</html>
