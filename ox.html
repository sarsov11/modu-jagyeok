<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0F766E">

<link rel="icon" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.skin=localStorage.getItem("mj.skin")||"white"}catch(e){document.documentElement.dataset.skin="white"}</script>
<link rel="stylesheet" href="css/app.css?v=1111h">
<link rel="stylesheet" href="css/diagram.css?v=1111h">
<style>
  .hd{display:flex;align-items:center;gap:10px;padding:18px 0 0}
  .hd h1{font-size:20px;flex:1;min-width:0}
  .hd .cnt{font-size:14px;color:var(--ink-3)}
  .hd a.x{color:var(--ink-4);text-decoration:none;font-size:20px;line-height:1;padding:4px}
  .lock{opacity:.35;pointer-events:none}
  .more{margin-top:10px;font-size:14px;color:var(--ink-3)}
  .readhd{display:flex;align-items:center;gap:10px;margin-top:18px}
  .readhd h2{font-size:16px;flex:1}
  .cardv section{margin-top:16px;border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;background:var(--surface)}
  .cardv h3{font-size:16px;font-weight:800;margin:0 0 8px;color:var(--ink)}
  .cardv ul{margin:0;padding-left:18px} .cardv li{font-size:14px;line-height:1.65;margin:4px 0}
  .cardv li small{display:block;font-size:13px;color:var(--ink-3);font-weight:600}
  .cardv .trap li{list-style:none;margin-left:-18px;padding:8px 0;border-top:1px dashed var(--line-2)}
  .cardv .trap li:first-child{border-top:0}
  .cardv .trap s{display:block;color:var(--ink-3);font-size:14px}
  .cardv .trap b{display:block;font-size:14px;color:var(--ink)}
  .cardv-src{margin-top:16px} .cardv-src summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--ink-3)}
  .empty{padding:48px 8px;text-align:center;color:var(--ink-3)}
  .spd{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.05em}
  .yodo-src{margin-top:16px}
  .yodo-src summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--ink-3);padding:8px 0}
</style>

<body class="focus">
<div class="page">
  <div class="hd"><a class="bk" href="index.html" title="뒤로" aria-label="뒤로">‹</a><h1 id="ttl">O·X</h1><span class="cnt num" id="cnt"></span><a class="x" href="index.html" title="그만하기">✕</a></div>
  <div class="stones" id="prog"></div>
  <div id="stage"></div>
</div>

<script src="js/tera-pad.js?v=1111h"></script>

<script src="js/tera-q.js?v=1111h"></script>

<script src="js/catalog.js?v=1111h"></script>
<script src="data/ready.js?v=1111h"></script>
<script src="js/boot.js?v=1111h"></script>
<script src="js/judge.js?v=1111h"></script>
<script src="js/store.js?v=1111h"></script>

<script>
(function () {
  "use strict";
  GB.mountNav("ox.html");
  var qsp = new URLSearchParams(location.search);
  var mode = qsp.get("mode") || (qsp.get("node") ? "node" : qsp.get("read") ? "read" : "today");
  var nodeNo = +(qsp.get("node") || qsp.get("read") || 0);
  var $ = function (id) { return document.getElementById(id); };
  var esc = GB.esc;

  /* ── 세션 목록 만들기 ──
     today 는 저장된 오늘 목록의 안 한 것부터. 나머지는 열 개씩. */
  var seq = [], todayIdx = [];
  if (mode === "today") {
    var t = GB.today();
    t.seq.forEach(function (s, i) { if (!s.done) { seq.push(s); todayIdx.push(i); } });
    $("ttl").textContent = "오늘 " + GB.minText(t.min);
  } else if (mode === "node") {
    var nd = GB.node(nodeNo);
    var wrong = GB.qs(nodeNo).filter(function (q) { var a = GB.answered(q.i); return a && !a.ok; });
    seq = wrong.concat(GB.freshOf(nodeNo, 10)).slice(0, 10).map(function (q) { return { k: "ox", id: q.i }; });
    GB.pairs(nodeNo).slice(0, 2).forEach(function (p, i) { seq.splice(3 + i * 4, 0, { k: "pair", id: p.id }); });
    /* 합격 지도 소주제(잎)에서 왔으면 그 소주제 문장만(공용 stree 1025) — 문장 id 는 skilltree.html 이 sessionStorage 에 넣는다 */
    if (qsp.get("leaf")) { try { var leafIds = JSON.parse(sessionStorage.getItem("stree.ids") || "null"); if (leafIds && leafIds.length) {
      var lset = {}; leafIds.forEach(function (i) { lset[i] = 1; });
      var lqs = GB.qs(nodeNo).filter(function (q) { return lset[q.i]; }), A = function (q) { return GB.answered(q.i); };
      seq = lqs.filter(function (q) { return A(q) && !A(q).ok; }).concat(lqs.filter(function (q) { return !A(q); }), lqs.filter(function (q) { return A(q) && A(q).ok; }))
        .slice(0, 10).map(function (q) { return { k: "ox", id: q.i }; });
    } } catch (e) {} }
    $("ttl").textContent = nd ? nd.name : "O·X";
  } else if (mode === "wrong") {
    seq = GB.wrongList().slice(0, 15).map(function (id) { return { k: "ox", id: id }; });
    $("ttl").textContent = "복습";
  } else if (mode === "pair") {
    var pl = (nodeNo ? GB.pairs(nodeNo) : GB.pairs()).filter(function (p) { return !GB.state().pairs[p.id] || !GB.state().pairs[p.id].ok; });
    shuffle(pl, 17);
    seq = pl.slice(0, 10).map(function (p) { return { k: "pair", id: p.id }; });
    $("ttl").textContent = "둘 중 맞는 문장";
  } else if (mode === "hard") {
    /* 어려운 O·X — 둘 중 맞는 문장(PAIRS)에 들어 있는 **틀린 쪽 문장**(맞는 문장과 한두 마디만 다르다)
       + 내가 확신하고 틀렸던 문장. 새 문장을 짓지 않는다. */
    var mine = Object.keys(GB.state().ans).filter(function (id) { var a = GB.state().ans[id]; return a.kind === "오개념" && GB.item(id); });
    var traps = GB.pairs().map(function (p) { return p.x.i; }).filter(function (id) { var a = GB.answered(id); return GB.item(id) && !(a && a.ok && a.conf === "sure"); });
    shuffle(traps, new Date().getDate());
    seq = mine.concat(traps).slice(0, 12).map(function (id) { return { k: "ox", id: id }; });
    $("ttl").textContent = "어려운 O·X";
  } else if (mode === "speed") {
    $("ttl").textContent = "60초 스피드";
  }

  function shuffle(a, seed) {
    var s = seed || 1;
    for (var i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; var j = Math.floor(s / 233280 * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }

  var pos = 0, results = [], streakBy = {};
  var planned = seq.length, extraCnt = 0;   /* 틀릴 때마다 한 문장씩 끼우되, 한 세트가 계획의 1.3배 안팎에서 끝나게 상한을 둔다 */
  /* 짜잔 3판 — 세트 안에서 쟁점 등급(S·A·B·C)이 오르면 끝에 승급 연출 */
  var tierBefore = {}, TORD = { L: 0, C: 1, B: 2, A: 3, S: 4 };
  function curTier(no) { var s = GB.nodeStat(no), a = s.achieve; return !s.solved ? "L" : a >= 80 ? "S" : a >= 60 ? "A" : a >= 30 ? "B" : "C"; }
  function noteTier(no) { if (!(no in tierBefore)) tierBefore[no] = curTier(no); }
  function cheerEnd(ok, n) {
    if (!window.ZZ || !n) return;
    var r = ok / n, k = r >= 1 ? 3 : r >= 0.7 ? 2 : r >= 0.4 ? 1 : 0;
    if (k) ZZ.stars(k);
    var best = null;
    Object.keys(tierBefore).forEach(function (no) {
      var a = tierBefore[no], b = curTier(no);
      if (a !== "L" && TORD[b] > TORD[a] && (!best || TORD[b] > TORD[best[1]])) best = [a, b];
    });
    if (best) ZZ.promote(best[0], best[1]);
  }

  function drawProg() {
    var n = seq.length;
    $("cnt").textContent = n ? Math.min(pos + 1, n) + " / " + n : "";
    /* 일자 징검다리(선호대장 1차) — 남은 문항이 반드시 보이게. 많으면 지금 자리 둘레 18칸만 */
    var from = Math.max(0, Math.min(pos - 6, n - 18)), to = Math.min(n, from + 18);
    var h = "";
    for (var i = from; i < to; i++) {
      var r = results[i];
      h += "<i class=\"" + (r ? (r.kind === "오개념" ? "warn" : r.ok ? "ok" : "no") : i === pos ? "now" : "") + "\"></i>";
    }
    var _db = (typeof doneBefore === "number" ? doneBefore : 0), _pc = (n + _db) ? Math.round((_db + Math.min(n, pos + (results[pos] ? 1 : 0))) / (n + _db) * 1000) / 10 : 0;
    $("prog").innerHTML = '<div class="trk"><i style="width:' + _pc + '%"></i></div><span class="left"><b>' + Math.max(0, n - pos - (results[pos] ? 1 : 0)) + '</b>문제 남았어요</span>';
  }

  function nodeChip(no) { var n = GB.node(no); return n ? '<span class="chip">' + esc(n.name) + "</span>" : ""; }

  /* 같은 쟁점에서 가장 닮은 **맞는** 기출 문장 — 틀린 문장을 고쳐 읽게 한다(지어낸 해설 대신) */
  function grams(t) { var s = t.replace(/\s+/g, ""), g = {}; for (var i = 0; i < s.length - 2; i++) g[s.substr(i, 3)] = 1; return g; }
  function sim(a, b) { var A = grams(a), B = grams(b), i = 0, u = 0, k; for (k in A) { u++; if (B[k]) i++; } for (k in B) if (!A[k]) u++; return u ? i / u : 0; }
  function nearestO(q) {
    var best = null, bs = 0;
    GB.qs(q.n).forEach(function (o) {
      if (o.ox !== "O" || o.i === q.i) return;
      var s = sim(q.t, o.t); if (s > bs) { bs = s; best = o; }
    });
    return bs >= 0.28 ? best : null;
  }
  function pairOf(id) {
    var ps = GB.pairs(GB.item(id).n);
    for (var i = 0; i < ps.length; i++) if (ps[i].o.i === id || ps[i].x.i === id) return ps[i];
    return null;
  }

  /* ── 한 문장 O·X ── */
  /* 풀이 창(화면표준 8절) — 계산 과목이거나 발문·선지가 계산 문항이면 문제 판 바로 아래 왼쪽에 「풀이 창」 단추.
     단계별 풀이 자료(steps)는 이 앱에 아직 없다 → steps 없이 연다(단계별 칸은 「준비 중」). */
  var CALC_SUBJ = /회계|원가|재무|세무|전산|계리|수리|통계/;
  function padHook(q, mc) {
    try {
      if (!window.TERA_PAD) return;
      var nd = q.n && GB.node ? GB.node(q.n) : null, nn = nd && nd.name ? nd.name : "";
      var txt = mc ? (mc.s || "") + " " + (mc.d || "") + " " + (mc.o || []).join(" ") : (q.t || "");
      var 계산과목 = CALC_SUBJ.test(String(GB.subject || "") + " " + nn);
      if (!계산과목 && !TERA_PAD.isCalc(txt)) return;
      var card = document.querySelector("#stage .qcard"); if (!card) return;
      var row = document.createElement("div"); row.className = "padrow";
      card.parentNode.insertBefore(row, card.nextSibling);
      TERA_PAD.button(row, function () {
        setTimeout(function () { try { var c = document.querySelector("#stage .qcard"); if (c) window.scrollTo({ top: Math.max(0, c.getBoundingClientRect().top + window.pageYOffset - 124), behavior: "smooth" }); } catch (e) {} }, 320);
        return { key: String(q.i || q.id || s_id(q)), title: nn || String(GB.subject || "") };
      });
    } catch (e) {}
  }
  function s_id(q) { return (q.t || "").slice(0, 24); }

  /* 분개 · T계정 판(1111) — 분개 드릴이 붙은 회계 과목 문제 화면에만. 풀이 창 단추 옆에 나란히 */
  var LED_KEYS = ["cp_acct","sm_acct","gs_acct","gp_acct","acct","g7acct","hm_acct","ac_acct","mg_acct","jk_fa","js_fa","js_jn"];
  function ledgerHook(q, mc) {
    try {
      if (!window.TERA_LEDGER) return;
      var k = (window.TREE && TREE.key) || ""; if (LED_KEYS.indexOf(k) < 0) return;
      var card = document.querySelector("#stage .qcard"); if (!card) return;
      var row = card.nextSibling && card.nextSibling.classList && card.nextSibling.classList.contains("padrow") ? card.nextSibling : null;
      if (!row) { row = document.createElement("div"); row.className = "padrow"; card.parentNode.insertBefore(row, card.nextSibling); }
      row.style.gap = "8px"; row.style.flexWrap = "wrap";
      var txt = mc ? (mc.s || "") + " " + (mc.d || "") + " " + (mc.o || []).join(" ") : (q.t || "");
      TERA_LEDGER.button(row, function () { return { key: "q" + String(q.i || q.id || (q.t || "").slice(0, 24)), text: txt }; });
    } catch (e) {}
  }
  /* 풀이 창이 열려 있는 동안 본문 아래 여백·「다음」 단추 자리를 창 높이만큼 비킨다 */
  setInterval(function () {
    var p = document.getElementById("tpad"), on = !!(p && p.classList.contains("on"));
    document.body.classList.toggle("tpad-open", on);
    document.body.classList.toggle("tpad-big", !!(p && p.classList.contains("big")));
  }, 250);
  /* ══ 문제 화면 공용 부품(tera-q, 화면표준 12절) — 발문 20/30 · 번호 줄 · 선지 줄 · 아래 줄 ══ */
  var TQ_MARK = "tier";   /* 공시·전문직 = 별 1~3, 자격 = S·A·B·C */
  var TQ_TOP = null;
  function tqTop() {   /* 해마다 문제 수 상위 20% 파트 — 합격 지도와 같은 셈(시험·연도·번호 한 문항 = 1) */
    if (TQ_TOP) return TQ_TOP;
    TQ_TOP = {};
    try {
      var ys = {}, rows = [];
      GB.T.nodes.forEach(function (n) { GB.qs(n.no).forEach(function (x) { if (x.y) ys[x.y] = 1; }); });
      var Y = Math.max(1, Object.keys(ys).length);
      GB.T.nodes.forEach(function (n) {
        var seen = {}, k = 0; GB.qs(n.no).forEach(function (x) { if (x.bk) return; var u = (x.e || "") + "|" + x.y + "|" + (x.qn || x.i); if (!seen[u]) { seen[u] = 1; k++; } });
        if (k) rows.push({ no: n.no, a: k / Y });
      });
      rows.sort(function (a, b) { return b.a - a.a; });
      rows.forEach(function (r, i) { TQ_TOP[r.no] = (i + 1) / rows.length; });
    } catch (e) {}
    return TQ_TOP;
  }
  function tqSync() {
    var h = document.getElementById("tqHalf"), c = $("conf");
    if (h && c) { var b = c.querySelectorAll("button")[1]; h.classList.toggle("is-on", !!(b && b.getAttribute("aria-pressed") === "true")); }
    var nx = document.getElementById("tqNext"), n = $("nx");
    if (nx) nx.disabled = !(n && $("after") && $("after").contains(n));
    var ex = document.getElementById("tqExp"); if (ex) ex.disabled = !$("expl");
  }
  function tqBar(q) {
    var bar = document.getElementById("tqbar"); if (!bar) return;
    bar.hidden = false; document.body.classList.add("tq-on");
    var cnt = $("cnt") ? $("cnt").textContent.split("/") : [];
    var pos = document.getElementById("tqPos"); if (pos) pos.innerHTML = (cnt[0] || "").trim() + (cnt[1] ? " <small>/ " + cnt[1].trim() + "</small>" : "");
    document.getElementById("tqHalf").onclick = function () {
      var bs = $("conf") && $("conf").querySelectorAll("button"); if (!bs || !bs[1]) return;
      (bs[1].getAttribute("aria-pressed") === "true" ? bs[0] : bs[1]).click(); tqSync();
    };
    document.getElementById("tqExp").onclick = function () { var e = $("expl") || $("after"); if (e) e.scrollIntoView({ behavior: "smooth", block: "start" }); };
    document.getElementById("tqPen").onclick = function () {
      if (!window.TERA_PAD || !TERA_PAD.pen) return;
      var self = this; TERA_PAD.pen({ key: String(q.i), onChange: function (on) { self.classList.toggle("is-on", !!on); } });
    };
    document.getElementById("tqNext").onclick = function () { var n = $("nx"); if (n) n.click(); };
    document.getElementById("tqPrev").disabled = true;
    tqSync();
    try { new MutationObserver(tqSync).observe($("after"), { childList: true, subtree: true }); } catch (e) {}
  }
  function tqDress(q, mc) {
    try {
      if (window.TERA_PAD && TERA_PAD.penHide) TERA_PAD.penHide();
      var pen = document.getElementById("tqPen"); if (pen) pen.classList.remove("is-on");
      var card = document.querySelector("#stage .qcard"); if (!card) return;
      var sent = $("sent"); if (sent) sent.classList.add("tq-stem");
      Array.prototype.forEach.call(card.querySelectorAll(".mcdata"), function (x) { x.classList.add("tq-box"); });
      /* 번호 줄 */
      var meta = document.createElement("div"); meta.className = "tq-meta";
      var cn = $("cnt") ? parseInt($("cnt").textContent, 10) : 0;
      meta.innerHTML = '<span class="tq-no">' + (cn || (pos + 1)) + '번 문제</span><span id="tqbd"></span><span class="tq-sp"></span><span id="tqtg"></span>';
      card.parentNode.insertBefore(meta, card);
      if (window.TERA_Q) {
        var fr = tqTop()[q.n]; if (fr) TERA_Q.badge(document.getElementById("tqbd"), TQ_MARK === "tier" ? { tier: fr <= 0.4 ? "S" : fr <= 0.7 ? "A" : fr <= 0.9 ? "B" : "C" } : { stars: fr <= 0.2 ? 3 : fr <= 0.5 ? 2 : 1 });
        TERA_Q.toggle(document.getElementById("tqtg"));
      }
      /* 선지 줄 */
      Array.prototype.forEach.call(document.querySelectorAll("#oxb.mcb button"), function (b, i) {
        var nb = b.querySelector("b"), sp = b.querySelector("span"); if (!nb || !sp) return;
        b.className = "tq-choice"; b.innerHTML = '<span class="tq-n">' + (i + 1) + '</span><span class="tq-t">' + sp.innerHTML + "</span>";
      });
      /* 확신도: 「헷갈림」을 안 켜면 확실 */
      var cb = $("conf") && $("conf").querySelectorAll("button"); if (cb && cb[0]) cb[0].click();
      if (window.TERA_Q) { TERA_Q.annotate($("sent")); TERA_Q.annotate(document.querySelectorAll("#oxb .tq-t")); }
      tqBar(q);
    } catch (e) { if (window.console) console.warn("tqDress", e); }
  }
  function showOX(s) {
    var q = GB.item(s.id);
    if (!q) { next(); return; }
    var conf = null, t0 = Date.now(), done = false;
    /* 기출 풀기(4지선다) — 국어·영어처럼 한 문장으로 못 자르는 문항. q.mc = {s:발문, d:자료, o:[선지 4], a:정답 1~4} */
    var mc = q.mc, 정답 = mc ? String(mc.a) : q.ox;
    var 단추 = mc
      ? '<div class="mcb lock" id="oxb">' + mc.o.map(function (o, i) {
          return '<button type="button" data-a="' + (i + 1) + '"><b>' + "①②③④⑤"[i] + "</b><span>" + esc(o) + "</span></button>"; }).join("") + "</div>"
      : '<div class="oxb lock" id="oxb"><button type="button" data-a="O">O</button><button type="button" data-a="X">X</button></div>';
    $("stage").innerHTML =
      '<div class="qcard"><div class="src">' + nodeChip(q.n) + '<span class="chip">' + esc(GB.src(q)) + "</span>" +
        (s.re ? '<span class="chip cta">다시 보기</span>' : "") + "</div>" +
        (q.sa ? '<div class="case"><b>사례</b>' + esc(q.sa) + "</div>" : "") +
        (q.tp ? '<div class="topic">' + esc(q.tp) + "</div>" : "") +
        '<p class="sent" id="sent">' + esc(mc ? mc.s : q.t) + "</p>" +
        (mc && mc.d ? '<div class="case mcdata" style="margin:12px 0 0">' + esc(mc.d) + "</div>" : "") + "</div>" +
      '<div class="step"><h3>얼마나 확실해요?</h3><div class="conf" id="conf">' +
        [{ v: "sure", name: "확실해요" }, { v: "half", name: "헷갈려요" }].map(function (c, i) { return '<button type="button" data-v="' + c.v + '" aria-pressed="false">' + c.name + "</button>"; }).join("") +
      "</div></div>" +
      단추 +
      '<p class="hint" id="hint">확실한지 먼저 골라요</p>' +
      '<div id="after"></div>';
    padHook(q, mc);
    ledgerHook(q, mc);
    /* 1110 아래 줄 수정: #tqbar 는 문서 끝에 있다 — 읽기가 끝난 뒤, 그래도 없으면 50ms 간격 20번까지 다시 */
    setTimeout(function () { (function tqGo(n) {
      if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", function () { tqGo(0); }, { once: true }); return; }
      if (!document.getElementById("tqbar") && n < 20) { setTimeout(function () { tqGo(n + 1); }, 50); return; }
      tqDress(q, mc);
    })(0); }, 0);
    var cb = $("conf").querySelectorAll("button");
    cb.forEach(function (b) {
      b.onclick = function () {
        if (done) return;
        conf = b.dataset.v;
        cb.forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        $("oxb").classList.remove("lock"); $("hint").textContent = "";
      };
    });
    $("oxb").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (done || !conf) return;
        done = true;
        var pick = b.dataset.a, ok = pick === 정답, ms = Date.now() - t0;
        $("oxb").querySelectorAll("button").forEach(function (x) {
          x.disabled = true;
          if (x.dataset.a === 정답) { x.dataset.s = "ok"; x.classList.add("ok"); } else if (x === b) { x.dataset.s = "no"; x.classList.add("no"); }
        });
        var st = GB.nodeStat(q.n), prev = GB.answered(q.i); noteTier(q.n);
        var j = JUDGE.판정({ ok: ok, conf: conf, ms: ms, attempt: prev ? prev.n + 1 : 1, mastery: st.mastery,
                             streak: streakBy[q.n] || 0, qid: q.i, leafName: GB.node(q.n).name });
        streakBy[q.n] = ok ? 0 : (streakBy[q.n] || 0) + 1;
        GB.answer(q.i, ok, { conf: conf, ms: ms, kind: j.kind });
        results[pos] = { ok: ok, kind: j.kind, id: q.i };
        document.querySelector(".qcard").classList.add(ok ? "glow-ok" : "glow-no");
        if (window.ZZ) { if (ok) ZZ.ok(b); else ZZ.no(b); }
        if (mode === "today") GB.markToday(todayIdx[pos]);
        drawProg();

        /* 판정이 "하나 더" 라고 하면 **실제로 끼운다** — 말만 하고 안 하면 그 말을 안 믿는다 */
        var extra = null;
        if (!ok || j.next === "same" || j.next === "similar") {
          var more = GB.freshOf(q.n, 3).filter(function (x) { return !seq.some(function (y) { return y.id === x.i; }); })[0];
          if (more && extraCnt < Math.max(4, Math.ceil(planned / 3))) { extraCnt++; extra = more; seq.splice(pos + 1, 0, { k: "ox", id: more.i, add: 1 }); if (mode === "today") todayIdx.splice(pos + 1, 0, -1); drawProg(); }
        }

        var h = '<div class="verdict ' + j.tone + (j.tone === "warn" ? " bad" : "") + '"><div class="top"><span class="mk">' + (ok ? "O" : "✕") + "</span>" +
          (ok ? '<span class="reward">+1</span>' : "") + '<span class="chip">' + esc(j.label || { "재시도정답": "다시 풀어 맞힘", "연속오답": "연속 오답" }[j.kind] || j.kind) + "</span></div>" +
          '<p class="ans">정답 <b>' + (mc ? "①②③④⑤"[+정답 - 1] : q.ox) + "</b></p>";
        var 해설 = "";
        var p = pairOf(q.i);
        if (p) {
          var d = GB.markDiff(p.o.t, p.x.t);
          해설 += '<div class="pair"><div class="lab">같은 내용을 맞게 낸 기출 · ' + esc((p.o.y || "") + " " + (p.o.e || "")) + "</div>" +
               '<p><b class="ok" style="color:var(--ok)">맞음</b> ' + d[0] + "</p>" +
               '<p><b class="no" style="color:var(--no)">틀림</b> ' + d[1] + "</p></div>";
        } else if (!mc && q.ox === "X") {
          var o = nearestO(q);
          if (o) 해설 += '<div class="pair"><div class="lab">같은 쟁점의 맞는 기출 문장 · ' + esc(GB.src(o)) + "</div><p>" + GB.markDiff(o.t, q.t)[0] + "</p></div>";
        }
        /* 원 문항 해설(TREE.hx — 문항 id 별, 1019 물류관리사). O·X 문장은 id 끝 「-선지번호」를 떼어 원 문항 해설을 찾는다 */
        var hx = (window.TREE && TREE.hx) || {}, hid = mc ? q.i : q.i.replace(/-\d$/, ""), hs = hx[hid];
        if (hs) 해설 += '<div class="pair"><div class="lab">해설 · ' + esc([q.y ? q.y + "년" : "", q.qn ? q.qn + "번" : "", !mc && q.m ? "(이 문장은 " + q.m + " 선지)" : ""].filter(Boolean).join(" ") || "문항") +
          '</div><p style="white-space:pre-line">' + esc(hs) + "</p></div>";
        /* 판정 코칭 문장(j.say)은 내지 않고 그 자리에 해설을 펼쳐 둔다(1014 — 전문직과 같게) */
        if (해설) h += '<div class="expl open" id="expl"><div class="body">' + 해설 + "</div></div>";
        if (extra) h += '<p class="more">다음에 ' + esc(GB.node(q.n).name) + " 문제 1개 더</p>";
        h += "</div>";
        var readBtn = (j.next === "concept" || j.next === "lecture")
          ? '<button class="btn ghost" id="read">' + JUDGE.다음말[j.next].t + "</button>" : "";
        h += '<div class="acts">' + readBtn + '<button class="btn" id="nx">다음</button></div>';
        $("after").innerHTML = h;
        $("nx").onclick = next;
        if ($("read")) $("read").onclick = function () { showRead(q.n, true); };

      };
    });
  }

  /* ── 둘 중 맞는 문장 고르기 ── */
  function showPair(s) {
    var p = GB.pair(s.id);
    if (!p) { next(); return; }
    var flip = (p.id.charCodeAt(p.id.length - 1) + new Date().getDate()) % 2 === 1;   /* 자리를 외우지 못하게 */
    var A = flip ? [p.x, p.o] : [p.o, p.x], done = false;
    $("stage").innerHTML =
      '<div class="qcard"><div class="src">' + nodeChip(p.n) + '<span class="chip cta">둘 중 맞는 문장</span></div>' +
      '<p class="sent" style="font-size:16px">두 기출 문장 중 <b>맞는 문장</b>을 고르세요.</p>' +
      '<div class="two" id="two">' + A.map(function (x, i) {
        return '<button type="button" data-i="' + x.i + '"><b>' + "가나"[i] + '</b><span class="tx">' + esc(x.t) + "</span></button>";
      }).join("") + "</div></div><div id=\"after\"></div>";
    $("two").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (done) return; done = true;
        var ok = b.dataset.i === p.o.i;
        var d = GB.markDiff(p.o.t, p.x.t);
        $("two").querySelectorAll("button").forEach(function (x) {
          x.disabled = true;
          var isO = x.dataset.i === p.o.i;
          x.querySelector(".tx").innerHTML = isO ? d[0] : d[1];
          if (isO) { x.dataset.s = "ok"; x.classList.add("ok"); } else if (x === b) { x.dataset.s = "no"; x.classList.add("no"); }
        });
        GB.pairAnswer(p.id, ok);
        if (window.ZZ) { if (ok) ZZ.ok(b); else ZZ.no(b); }
        results[pos] = { ok: ok, kind: ok ? "정답" : "오답", pair: 1 };
        if (mode === "today") GB.markToday(todayIdx[pos]);
        drawProg();
        $("after").innerHTML = '<div class="verdict ' + (ok ? "good" : "bad") + '"><div class="top"><span class="mk">' + (ok ? "O" : "✕") + "</span></div>" +
          '<p class="say">' + (ok ? "정답" : "오답") + "</p>" +
          '<p class="ans">출처 — 맞음 ' + esc((p.o.y || "") + " " + (p.o.e || "")) + " · 틀림 " + esc((p.x.y || "") + " " + (p.x.e || "")) + "</p></div>" +
          '<div class="acts"><button class="btn" id="nx">다음</button></div>';
        $("nx").onclick = next; $("nx").focus({ preventScroll: true });
      };
    });
  }

  /* ── 쟁점 요점 — 그 쟁점의 O 기출 선지를 모아 보여 준다 ── */
  /* 개념카드(2026-10-09) — 쟁점 이름으로 짝을 찾는다. 묶음(소제목+줄, 출처) → 함정(틀린 문장 → 바른 문장) */
  function cardHTML(nd) {
    var c = window.CARD && (CARD["#" + nd.no] || CARD[nd.name]); if (!c) return "";
    return '<div class="cardv">' + c.묶음.map(function (b) {
      return '<section><h3>' + esc(b.머리) + '</h3><ul>' + b.줄.map(function (l) {
        return '<li>' + esc(l.t) + (l.src ? '<small>' + esc(l.src) + '</small>' : '') + '</li>'; }).join("") + '</ul></section>';
    }).join("") + (c.함정 && c.함정.length ? '<section class="trap"><h3>함정</h3><ul>' + c.함정.map(function (h) {
      return '<li><s>' + esc(h.x) + '</s><b>' + esc(h.o) + '</b></li>'; }).join("") + '</ul></section>' : "") + '</div>';
  }
  /* 오늘 학습의 읽기 칸(11-06) — 카드를 보여 주고, 다 읽으면 끝낸 표시 뒤 다음 칸. 맞힘 수에는 안 넣는다 */
  var 읽는중 = null;
  function showLearn(s) { if (!GB.node(s.n)) { 읽기끝(); return; } 읽는중 = s; showRead(s.n, true); }
  function 읽기끝() {
    if (읽는중) { 읽는중 = null; if (mode === "today") GB.markToday(todayIdx[pos]); }
    next();
  }
  /* 분개 드릴로 가는 주 단추 — 이 쟁점에 이어진 분개 단원이 있을 때만 */
  function jdLink(nos) {
    try {
      var R = window.JREC; if (!R || !R.on()) return null;
      nos = [].concat(nos); var us = [];
      nos.forEach(function (no) { R.unitsFor(no).forEach(function (u) { if (us.indexOf(u) < 0) us.push(u); }); });
      if (!us.length) return null;
      var u = us[0], a = R.nextAcct(u) || u.accts[0];
      return { a: '<a class="btn" href="' + R.href(u, a) + '">분개 드릴 ' + R.count(u) + "거래</a>" };
    } catch (e) { return null; }
  }
  function showRead(no, back) {
    var JD = jdLink(no); if (window.JREC && JREC.on()) JREC.markRead(no);   /* 회계 과목이면 주 단추 자리에 「분개 드릴 N거래」 */
    /* 도식(2026-10-26 대표님 「모든 과목 개념을 도식으로」) — data/dosik/<과목>.js 가 있으면 위에 도식, 원래 글은 아래에 접는다 */
    var dkey = (window.TREE && TREE.key) || "";
    if (dkey && window.DIAGRAM && !(window.DOSIK && DOSIK[dkey]) && !showRead.불러봄) {
      showRead.불러봄 = 1;
      var dsc = document.createElement("script"); dsc.src = "data/dosik/" + dkey + ".js";
      dsc.onload = dsc.onerror = function () { showRead(no, back); }; document.head.appendChild(dsc); return;
    }
    var 도식 = (function () { var D = window.DOSIK && DOSIK[dkey]; if (!D) return ""; var nd0 = GB.node(no); var b = D["#" + no] || D[String(no)] || (nd0 && D[nd0.name]); return b ? '<div class="yodo">' + b.map(DIAGRAM.html).join("") + "</div>" : ""; })();
    var nd = GB.node(no), 카드 = cardHTML(nd);
    if (카드) {
      var os0 = GB.qs(no).filter(function (q) { return q.ox === "O"; });
      $("stage").innerHTML = '<div class="readhd">' + (읽는중 ? '<span class="chip">개념</span>' : "") + '<h2>' + esc(nd.name) + '</h2></div>' + (도식 ? 도식 + '<details class="yodo-src"><summary>개념 카드 원문</summary>' + 카드 + '</details>' : 카드) +
        (os0.length ? '<details class="cardv-src"><summary>맞는 기출 문장 ' + os0.length + '개</summary><div class="readlist">' +
          os0.map(function (q) { return "<p>" + esc(q.t) + "<small>" + esc(GB.src(q)) + "</small></p>"; }).join("") + '</div></details>' : '') +
        '<div class="acts">' + (JD ? JD.a : "") + (back ? '<button class="btn' + (JD ? " ghost" : "") + '" id="nx">시작</button>' : '<a class="btn' + (JD ? " ghost" : "") + '" href="ox.html?node=' + no + '">이 쟁점 O·X 풀기</a>') + '</div>';
      if (back) $("nx").onclick = 읽기끝;
      window.scrollTo(0, 0); return;
    }
    var os = GB.qs(no).filter(function (q) { return q.ox === "O"; })
      .sort(function (a, b) { return (b.y || 0) - (a.y || 0); }).slice(0, 12);
    var h = '<div class="readhd">' + (읽는중 ? '<span class="chip">개념</span>' : "") + '<h2>' + esc(nd.name) + " — 맞는 기출 문장</h2></div>" +
      '<p class="muted" style="margin:4px 0 0;font-size:14px">시험에 맞는 문장으로 나온 것만 모았어요. 최근 것부터.</p>' +
      (도식 ? 도식 + '<details class="yodo-src"><summary>맞는 기출 문장 ' + os.length + '개</summary>' : "") + '<div class="readlist">' + os.map(function (q) { return "<p>" + esc(q.t) + "<small>" + esc(GB.src(q)) + "</small></p>"; }).join("") + "</div>" + (도식 ? "</details>" : "") +
      '<div class="acts">' + (JD ? JD.a : "") + (back ? '<button class="btn' + (JD ? " ghost" : "") + '" id="nx">시작</button>'
                                   : '<a class="btn' + (JD ? " ghost" : "") + '" href="ox.html?node=' + no + '">이 쟁점 O·X 풀기</a>') + "</div>";
    $("stage").innerHTML = h;
    if (back) $("nx").onclick = 읽기끝;
    window.scrollTo(0, 0);
  }

  /* ── 60초 스피드 — 확신도 없이, 반응만 ── */
  function runSpeed() {
    var pool = [];
    GB.focusNodes(6).forEach(function (n) { pool = pool.concat(GB.qs(n.no).filter(function (q) { return q.t.length <= 80 && !q.sa && !q.mc; })); });
    /* 짧은 문장이 12개 미만이면(문장이 긴 과목) 전체에서 가장 짧은 문장 40개로 */
    if (pool.length < 12) {
      var all = []; GB.nodes.forEach(function (n) { all = all.concat(GB.qs(n.no).filter(function (q) { return !q.sa && !q.mc; })); });
      all.sort(function (x, y) { return x.t.length - y.t.length; }); pool = all.slice(0, 40);
    }
    shuffle(pool, Date.now() % 997);
    if (!pool.length) { $("stage").innerHTML = '<div class="empty">이 과목에는 60초 스피드로 풀 짧은 문장이 아직 없습니다.<div class="acts" style="justify-content:center;margin-top:18px"><a class="btn ghost" href="drill.html">드릴로</a><a class="btn" href="skilltree.html">합격 지도</a></div></div>'; return; }
    var end = Date.now() + 60000, i = 0, ok = 0, n = 0;
    function one() {
      if (Date.now() >= end || i >= pool.length) return fin();
      var q = pool[i++], t0 = Date.now();
      $("stage").innerHTML = '<div class="spd num" id="left"></div><div class="qcard"><div class="src">' + nodeChip(q.n) +
        '</div><p class="sent">' + esc(q.t) + '</p></div><div class="oxb" id="oxb"><button data-a="O">O</button><button data-a="X">X</button></div>';
      $("oxb").querySelectorAll("button").forEach(function (b) {
        b.onclick = function () {
          var good = b.dataset.a === q.ox; n++; if (good) ok++;
          b.dataset.s = good ? "ok" : "no"; b.classList.add(good ? "ok" : "no");
          if (window.ZZ) { if (good) ZZ.ok(b); else ZZ.no(b); }
          GB.answer(q.i, good, { ms: Date.now() - t0 });
          setTimeout(one, good ? 250 : 900);
        };
      });
    }
    var tick = setInterval(function () {
      var l = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      if ($("left")) $("left").textContent = l + "초";
      if (l <= 0) { clearInterval(tick); fin(); }
    }, 200);
    var fined = false;
    function fin() {
      if (fined) return; fined = true; clearInterval(tick); cheerEnd(ok, n);
      $("stage").innerHTML = '<div class="done"><div class="big num">' + ok + " / " + n + '</div><p class="muted">60초 동안 ' + n + "문장, " + ok + '개 맞힘</p>' +
        '<div class="acts"><a class="btn ghost" href="drill.html">드릴로</a><a class="btn" href="ox.html?mode=speed">한 번 더</a></div></div>';
    }
    one();
  }

  function next() {
    pos++;
    drawProg();
    if (pos >= seq.length) return finish();
    var s = seq[pos];
    if (s.k === "pair") showPair(s); else if (s.k === "learn") showLearn(s); else showOX(s);
    window.scrollTo(0, 0);
  }

  function finish() {
    var n = results.filter(Boolean).length, ok = results.filter(function (r) { return r && r.ok; }).length;
    var mis = results.filter(function (r) { return r && r.kind === "오개념"; }).length;
    var tomorrow = GB.dueList().length;
    $("prog").innerHTML = ""; $("cnt").textContent = "";
    var tb = document.getElementById("tqbar"); if (tb) tb.hidden = true; document.body.classList.remove("tq-on");
    var todayDone = mode === "today"; cheerEnd(ok, n);
    var nodesDone = []; seq.forEach(function (x) { if (x.k === "ox") { var q0 = GB.item(x.id); if (q0 && nodesDone.indexOf(q0.n) < 0) nodesDone.push(q0.n); } }); if (nodeNo && nodesDone.indexOf(nodeNo) < 0) nodesDone.push(nodeNo);
    var JD = jdLink(nodesDone);
    $("stage").innerHTML = '<div class="done">' +
      (n ? '<div class="big num">' + ok + " / " + n + "</div>" : '<div class="big">끝</div>') +
      '<p class="muted">' + (todayDone ? "오늘 분량 완료." : "이번 묶음을 다 풀었어요.") + "</p>" +
      '<div class="grid3" style="grid-template-columns:repeat(2,1fr)"><div><b class="num">' + ok + "</b><span>맞힘</span></div><div><b class=\"num\">" + mis +
      '</b><span>확신했는데 틀림</span></div></div>' +
      '<div class="acts" style="margin-top:22px;flex-wrap:wrap">' + (JD ? JD.a.replace('class="btn"', 'class="btn" style="flex:1 1 100%"') : "") + '<a class="btn ghost" href="index.html">오늘</a>' +
      (mis ? '<a class="btn' + (JD ? " ghost" : "") + '" href="ox.html?mode=hard">어려운 O·X</a>' : '<a class="btn' + (JD ? " ghost" : "") + '" href="ox.html?mode=wrong">복습</a>') + "</div></div>";
  }

  /* 키보드 — 1·2·3 확신도, O·X, Enter 다음 */
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    var k = e.key.toLowerCase();
    if (k === "1" || k === "2") { var b = document.querySelectorAll("#conf button")[+k - 1]; if (b) b.click(); }
    else if (k === "o") { var o = document.querySelector('#oxb [data-a="O"]'); if (o) o.click(); }
    else if (k === "x") { var x = document.querySelector('#oxb [data-a="X"]'); if (x) x.click(); }
    else if (k === "enter") { var n = $("nx"); if (n) { e.preventDefault(); n.click(); } }
  });

  if (mode === "wrong" && window.JREC && JREC.reviewCount() && !/[?&]nojd/.test(location.search)) {   /* 분개 복습: 「분개」 딱지 카드에서 그 거래 풀이로 */
    $("prog").innerHTML = ""; $("cnt").textContent = "";
    $("stage").innerHTML = '<div class="done"><div class="big num">' + JREC.reviewCount() + '</div><p class="muted">분개 복습 <span class="chip cta">분개</span></p><div class="acts" style="margin-top:22px;flex-wrap:wrap"><a class="btn" style="flex:1 1 100%" href="journal.html?review=1">시작</a>' +
      (seq.length ? '<a class="btn ghost" style="flex:1 1 100%" href="ox.html?mode=wrong&nojd=1">문장 복습 ' + seq.length + '개</a>' : '') + '</div></div>';
    return;
  }
  if (mode === "read") { showRead(nodeNo, false); $("ttl").textContent = (window.CARD && (CARD["#" + nodeNo] || CARD[(GB.node(nodeNo) || {}).name])) ? "개념 카드" : "쟁점 요점"; return; }
  if (mode === "speed") { runSpeed(); return; }
  if (!seq.length) {
    var noPair = !GB.pairs().length;
    $("stage").innerHTML = '<div class="empty">' + (mode === "today" ? "오늘 분량 완료. 내일 새 분량." :
      mode === "wrong" ? "복습할 문장이 없어요." :
      mode === "pair" ? (noPair ? "이 과목에는 한두 마디만 다른 기출 문장 쌍이 아직 없습니다." : "둘 중 맞는 문장을 모두 맞혔습니다.") :
      mode === "hard" ? (noPair ? "이 과목에는 어려운 O·X로 쓸 문장이 아직 없습니다." : "풀 문장이 없어요.") : "풀 문장이 없어요.") +
      '<div class="acts" style="justify-content:center;margin-top:18px"><a class="btn' + (mode === "today" ? "" : " ghost") + '" href="index.html">오늘</a>' +
      (mode === "today" ? "" : '<a class="btn" href="skilltree.html">합격 지도</a>') + '</div></div>';
    return;
  }
  pos = -1; next();
})();
</script>
